<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Coffee — Subscriptions</title>
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #FAFAF9; color: #292524; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 24px; }
  .card { background: #fff; border: 1px solid #E7E5E4; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .muted { color: #78716C; }
  a.button { display: inline-block; background: #B4471F; color: #fff; padding: 12px 20px; border-radius: 12px; text-decoration: none; }
</style>
</head>
<body>
  <header><strong>Ember Coffee</strong></header>
  <main>
    <h1>Fresh beans, every other week</h1>
    <div class="card">
      <h2>House blend</h2>
      <p class="muted">Chocolate, cherry, toasted almond.</p>
      <a class="button" href="#subscribe">Subscribe</a>
    </div>
  </main>
  <footer class="muted">© Ember Coffee Roasters</footer>
</body>
</html>
